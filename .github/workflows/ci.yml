name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Resolve the remote package from GitHub + build for the iOS Simulator
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: xcodebuild -version
      - name: Resolve AssistantModes from GitHub at the exact version in Package.resolved
        run: >
          xcodebuild -resolvePackageDependencies
          -project Demo.xcodeproj -scheme Demo
          -onlyUsePackageVersionsFromResolvedFile
      - name: Build the Demo app (warnings as errors on the app target)
        run: >
          xcodebuild build
          -project Demo.xcodeproj
          -scheme Demo
          -destination 'generic/platform=iOS Simulator'
          -onlyUsePackageVersionsFromResolvedFile
          CODE_SIGNING_ALLOWED=NO

  foundation-models:
    name: Build with the Foundation Models SDK (compiles the -systemModel path)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: xcodebuild -version
      - name: Resolve AssistantModes from GitHub at the exact version in Package.resolved
        run: >
          xcodebuild -resolvePackageDependencies
          -project Demo.xcodeproj -scheme Demo
          -onlyUsePackageVersionsFromResolvedFile
      - name: Build the Demo app
        run: >
          xcodebuild build
          -project Demo.xcodeproj
          -scheme Demo
          -destination 'generic/platform=iOS Simulator'
          -onlyUsePackageVersionsFromResolvedFile
          CODE_SIGNING_ALLOWED=NO
